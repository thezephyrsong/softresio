name: Scrape WotLK Loot

on:
  push:
    paths:
      - 'backend/instances/scripts/instances_wotlk.json' # Triggers when instances_wotlk.json in this directory updates
    branches:
      - main

  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/instances/scripts/requirements.txt'

      - name: Install dependencies
        working-directory: backend/instances/scripts
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 tqdm
          fi

      - name: Run Scraper Script
        working-directory: backend/instances/scripts
        run: |
          python scrape_loot_triumvirate.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "auto: update scraped loot data"
          title: "Auto-Update: Scraped WotLK Loot Data"
          body: |
            Automated update generated by `scrape_loot_triumvirate.py` following a change to `instances_wotlk.json`.
            
            Please review the generated raid JSON files in `backend/instances/triumvirate/` and `icon_cache.json` before merging into `main`.
          branch: auto-update-wotlk-loot
          delete-branch: true
          base: main